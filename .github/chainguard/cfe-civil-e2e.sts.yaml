issuer: https://token.actions.githubusercontent.com
subject_pattern: '^repo:ministryofjustice/cfe-civil:(ref:refs/heads/main|pull_request)$'
claim_pattern:
  workflow_ref: '^ministryofjustice/cfe-civil/\.github/workflows/test-build-deploy\.yml@(refs/heads/main|refs/pull/[0-9]+/merge)$'
  job_workflow_ref: '^ministryofjustice/cfe-civil/\.github/workflows/end2end-reusable\.yml@refs/heads/main$'
  event_name: '^(pull_request|push|workflow_dispatch)$'

permissions:
  contents: read
