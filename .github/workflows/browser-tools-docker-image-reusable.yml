name: "Browsertools docker image reusable"

on:
  workflow_call:
    inputs:
      candidate_files_b64:
        description: Base64 archive of the prepared Puppeteer candidate files.
        required: true
        type: string
      base_sha:
        description: Captured main commit used to prepare the candidate.
        required: true
        type: string
      ruby_version:
        description: Ruby version declared by the captured main commit.
        required: true
        type: string
      puppeteer_version:
        description: Validated Puppeteer version in the prepared candidate.
        required: true
        type: string
      image_tag:
        description: Unique image tag for this workflow run and attempt.
        required: true
        type: string

    outputs:
      image_digest:
        description: Digest of the verified published runner image.
        value: ${{ jobs.build-push.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      CANDIDATE_FILES_B64: ${{ inputs.candidate_files_b64 }}
      BASE_SHA: ${{ inputs.base_sha }}
      RUBY_VERSION: ${{ inputs.ruby_version }}
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_REPOSITORY: checkclientqualifiesdocker/circleci-image
    steps:
      - name: Validate trusted caller and prepared candidate
        run: |
          expected_workflow="${GITHUB_REPOSITORY}/.github/workflows/puppeteer_upgrade.yml@refs/heads/main"
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]; then
            echo "Runner publication is allowed only from Puppeteer upgrade dispatches on main." >&2
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid captured base commit." >&2
            exit 1
          fi

          if ! [[ "$RUBY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid runner version metadata." >&2
            exit 1
          fi

          expected_tag="ruby-${RUBY_VERSION}-puppeteer-${PUPPETEER_VERSION}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if [ "$IMAGE_TAG" != "$expected_tag" ]; then
            echo "Image tag does not match this run and candidate." >&2
            exit 1
          fi

      - name: Decode and validate prepared tooling definition
        run: |
          archive="$RUNNER_TEMP/candidate.tar.gz"
          prepared_dir="$RUNNER_TEMP/prepared-candidate"
          mkdir -p "$prepared_dir"
          printf '%s' "$CANDIDATE_FILES_B64" | base64 --decode > "$archive"

          expected_files="$(printf '%s\n' Dockerfile_browser_tools.dockerfile package.json yarn.lock | LC_ALL=C sort)"
          actual_files="$(tar -tzf "$archive" | LC_ALL=C sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Prepared candidate archive contains unexpected files." >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$prepared_dir"

          package_version="$(node -e 'process.stdout.write(require(process.argv[1]).dependencies.puppeteer)' "$prepared_dir/package.json")"
          lock_entry_count="$(grep -Fxc "puppeteer@${PUPPETEER_VERSION}:" "$prepared_dir/yarn.lock" || true)"
          dockerfile_version="$(sed -nE 's|^RUN yarn add puppeteer@([^[:space:]]+)$|\1|p' "$prepared_dir/Dockerfile_browser_tools.dockerfile")"
          ruby_base_version="$(sed -nE 's|^FROM cimg/ruby:([0-9]+\.[0-9]+\.[0-9]+)-browsers@sha256:[[:xdigit:]]+$|\1|p' "$prepared_dir/Dockerfile_browser_tools.dockerfile")"

          if [ "$package_version" != "$PUPPETEER_VERSION" ] || [ "$lock_entry_count" -ne 1 ] || [ "$dockerfile_version" != "$PUPPETEER_VERSION" ]; then
            echo "Prepared application and runner Puppeteer versions do not agree." >&2
            exit 1
          fi
          if [ "$ruby_base_version" != "$RUBY_VERSION" ]; then
            echo "Prepared runner Ruby base does not match .ruby-version." >&2
            exit 1
          fi
          echo "Candidate ${BASE_SHA}: Ruby ${RUBY_VERSION}, Puppeteer ${PUPPETEER_VERSION}."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER_CCQ }}
          password: ${{ secrets.DOCKERHUB_PAT_CCQ }}

      - name: Build, smoke-test and publish immutable runner
        id: publish
        run: |
          prepared_dir="$RUNNER_TEMP/prepared-candidate"
          context="$RUNNER_TEMP/runner-context"
          image_ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          mkdir -p "$context"
          cp "$prepared_dir/Dockerfile_browser_tools.dockerfile" "$context/Dockerfile_browser_tools.dockerfile"

          tag_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE_REPOSITORY}/tags/${IMAGE_TAG}")"
          case "$tag_status" in
            404) ;;
            200)
              echo "Refusing to overwrite existing runner image tag '${IMAGE_TAG}'." >&2
              exit 1
              ;;
            *)
              echo "Docker Hub tag check failed with HTTP ${tag_status}. Refusing to publish." >&2
              exit 1
              ;;
          esac

          docker buildx build --platform linux/amd64 --load --tag "$image_ref" --file "$context/Dockerfile_browser_tools.dockerfile" "$context"

          actual_ruby="$(docker run --rm --entrypoint ruby "$image_ref" -e 'print RUBY_VERSION')"
          actual_puppeteer="$(docker run --rm --entrypoint node "$image_ref" -e 'process.stdout.write(require("/app/node_modules/puppeteer/package.json").version)')"
          if [ "$actual_ruby" != "$RUBY_VERSION" ] || [ "$actual_puppeteer" != "$PUPPETEER_VERSION" ]; then
            echo "Runner version mismatch. Ruby ${actual_ruby}, Puppeteer ${actual_puppeteer}." >&2
            exit 1
          fi

          docker run --rm --entrypoint bash "$image_ref" -lc 'test "$(id -u)" -ne 0 && test ! -d /app/app && ruby --version >/dev/null && node --version >/dev/null && yarn --version >/dev/null && pdftk --version >/dev/null'
          docker run --rm --entrypoint node "$image_ref" -e '
            const puppeteer = require("/app/node_modules/puppeteer");
            (async () => {
              const browser = await puppeteer.launch({ headless: true });
              try {
                const page = await browser.newPage();
                await page.setContent("<title>runner smoke</title>");
                if (await page.title() !== "runner smoke") {
                  throw new Error("Headless Chrome did not render the smoke page.");
                }
              } finally {
                await browser.close();
              }
            })().catch((error) => {
              console.error(error);
              process.exitCode = 1;
            });
          '

          push_log="$RUNNER_TEMP/docker-push.log"
          if ! docker push "$image_ref" > "$push_log" 2>&1; then
            cat "$push_log" >&2
            echo "Runner image publication failed." >&2
            exit 1
          fi
          cat "$push_log"

          image_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64})([[:space:]].*)?$/\1/p' "$push_log" | tail -n 1)"
          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not return a valid published image digest." >&2
            exit 1
          fi
          docker pull "${IMAGE_REPOSITORY}@${image_digest}"
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
          echo "Published and retrieved ${IMAGE_REPOSITORY}@${image_digest} (${IMAGE_TAG})."
