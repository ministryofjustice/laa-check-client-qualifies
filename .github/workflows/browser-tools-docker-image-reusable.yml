name: "Browsertools docker image reusable"

on:
  workflow_call:
    inputs:
      candidate_files_b64:
        description: Base64 archive of the prepared Puppeteer candidate files.
        required: true
        type: string
      base_sha:
        description: Base main commit SHA used to prepare the candidate.
        required: true
        type: string
      ruby_version:
        description: Ruby version declared by the base commit.
        required: true
        type: string
      puppeteer_version:
        description: Validated Puppeteer version in the prepared candidate.
        required: true
        type: string
      image_tag:
        description: Unique image tag for this workflow run and attempt.
        required: true
        type: string

    outputs:
      image_digest:
        description: Digest of the verified published runner image.
        value: ${{ jobs.build-push.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      CANDIDATE_FILES_B64: ${{ inputs.candidate_files_b64 }}
      BASE_SHA: ${{ inputs.base_sha }}
      RUBY_VERSION: ${{ inputs.ruby_version }}
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_REPOSITORY: checkclientqualifiesdocker/circleci-image
      IMAGE_REF: checkclientqualifiesdocker/circleci-image:${{ inputs.image_tag }}
    steps:
      - name: Validate trusted caller and prepared candidate
        run: |
          is_trusted_upgrade_dispatch() {
            [ "$GITHUB_REF" = "refs/heads/main" ] &&
              [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
              [ "$GITHUB_WORKFLOW_REF" = "$expected_workflow" ]
          }

          expected_workflow="${GITHUB_REPOSITORY}/.github/workflows/puppeteer_upgrade.yml@refs/heads/main"
          if ! is_trusted_upgrade_dispatch; then
            echo "Runner publication is allowed only from Puppeteer upgrade dispatches on main." >&2
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base commit SHA." >&2
            exit 1
          fi

          if ! [[ "$RUBY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid runner Ruby version." >&2
            exit 1
          fi
          if ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Puppeteer version." >&2
            exit 1
          fi

          expected_tag="ruby-${RUBY_VERSION}-puppeteer-${PUPPETEER_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$IMAGE_TAG" != "$expected_tag" ]; then
            echo "Image tag does not match this run and candidate." >&2
            exit 1
          fi

      - name: Decode and validate prepared tooling definition
        run: |
          archive="$RUNNER_TEMP/candidate.tar.gz"
          prepared_dir="$RUNNER_TEMP/prepared-candidate"
          context="$RUNNER_TEMP/runner-context"
          mkdir -p "$prepared_dir"
          printf '%s' "$CANDIDATE_FILES_B64" | base64 --decode > "$archive"
          tar -xzf "$archive" -C "$prepared_dir" -- package.json yarn.lock Dockerfile_browser_tools.dockerfile

          package_version="$(node -p "require('${prepared_dir}/package.json').dependencies.puppeteer")"
          ruby_base_version="$(sed -nE 's|^FROM cimg/ruby:([0-9]+\.[0-9]+\.[0-9]+)-browsers@sha256:[[:xdigit:]]+$|\1|p' "$prepared_dir/Dockerfile_browser_tools.dockerfile")"

          if [ "$package_version" != "$PUPPETEER_VERSION" ]; then
            echo "Prepared package.json does not match the requested Puppeteer version." >&2
            exit 1
          fi
          if ! grep -Fqx "puppeteer@${PUPPETEER_VERSION}:" "$prepared_dir/yarn.lock"; then
            echo "Prepared yarn.lock does not match the requested Puppeteer version." >&2
            exit 1
          fi
          if ! grep -Fqx "RUN yarn add puppeteer@${PUPPETEER_VERSION}" "$prepared_dir/Dockerfile_browser_tools.dockerfile"; then
            echo "Prepared runner does not match the requested Puppeteer version." >&2
            exit 1
          fi
          if [ "$ruby_base_version" != "$RUBY_VERSION" ]; then
            echo "Prepared runner Ruby base does not match .ruby-version." >&2
            exit 1
          fi
          echo "Candidate ${BASE_SHA}: Ruby ${RUBY_VERSION}, Puppeteer ${PUPPETEER_VERSION}."
          mkdir -p "$context"
          cp "$prepared_dir/Dockerfile_browser_tools.dockerfile" "$context/Dockerfile_browser_tools.dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER_CCQ }}
          password: ${{ secrets.DOCKERHUB_PAT_CCQ }}

      - name: Check image tag and build runner
        run: |
          tag_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE_REPOSITORY}/tags/${IMAGE_TAG}")"
          case "$tag_status" in
            404) ;;
            200)
              echo "Refusing to overwrite existing runner image tag '${IMAGE_TAG}'." >&2
              exit 1
              ;;
            *)
              echo "Docker Hub tag check failed with HTTP ${tag_status}. Refusing to publish." >&2
              exit 1
              ;;
          esac

          docker buildx build --platform linux/amd64 --load --tag "$IMAGE_REF" \
            --file "$RUNNER_TEMP/runner-context/Dockerfile_browser_tools.dockerfile" \
            "$RUNNER_TEMP/runner-context"

      - name: Smoke-test runner
        run: |
          actual_ruby="$(docker run --rm --entrypoint ruby "$IMAGE_REF" -e 'print RUBY_VERSION')"
          if [ "$actual_ruby" != "$RUBY_VERSION" ]; then
            echo "Runner Ruby version mismatch. Expected ${RUBY_VERSION}, got ${actual_ruby}." >&2
            exit 1
          fi

          actual_puppeteer="$(docker run --rm --entrypoint node "$IMAGE_REF" -e 'process.stdout.write(require("/app/node_modules/puppeteer/package.json").version)')"
          if [ "$actual_puppeteer" != "$PUPPETEER_VERSION" ]; then
            echo "Runner Puppeteer version mismatch. Expected ${PUPPETEER_VERSION}, got ${actual_puppeteer}." >&2
            exit 1
          fi

          docker run --rm --entrypoint bash "$IMAGE_REF" -euc '
            test "$(id -u)" -ne 0
            test ! -d /app/app
            ruby --version
            node --version
            yarn --version
            pdftk --version
          '
          docker run --rm --entrypoint node "$IMAGE_REF" -e 'require("/app/node_modules/puppeteer").launch({ headless: true }).then((browser) => browser.close())'

      - name: Publish runner and verify digest
        id: publish
        run: |
          push_log="$RUNNER_TEMP/docker-push.log"
          docker push "$IMAGE_REF" 2>&1 | tee "$push_log"

          image_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64})([[:space:]].*)?$/\1/p' "$push_log" | tail -n 1)"
          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not return a valid published image digest." >&2
            exit 1
          fi
          docker pull "${IMAGE_REPOSITORY}@${image_digest}"
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
          echo "Published and retrieved ${IMAGE_REPOSITORY}@${image_digest} (${IMAGE_TAG})."
