name: "Generate browsertools docker image"
on:
  push:
    branches:
      - main
      - chore/upgrade-puppeteer/*
    paths:
      - Dockerfile_browser_tools.dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Derive Docker-safe image tag from ref
        id: tag
        run: |
          set -eu
          # Docker tags can't contain slashes, so branch chore/upgrade-puppeteer/<version> maps to puppeteer-<version>.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_tag=main" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME##*/}"
            echo "image_tag=puppeteer-${version}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: compute-tag
    uses: ./.github/workflows/browser-tools-docker-image-reusable.yml
    with:
      source_ref: ${{ github.ref_name }}
      image_tag: ${{ needs.compute-tag.outputs.image_tag }}
      source_actor: ${{ github.actor }}
      enforce_actor_policy: true
    secrets: inherit
