name: Puppeteer upgrade PR

on:
  workflow_dispatch:
    inputs:
      puppeteer_version:
        description: Puppeteer version to upgrade to (example 25.2.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request and set upgrade metadata
        id: metadata
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            printf 'This workflow must be dispatched from main; current ref is %q.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          if ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid Puppeteer version %q. Expected semver like 25.2.1.\n' "$PUPPETEER_VERSION" >&2
            exit 1
          fi

          ruby_version="$(tr -d '[:space:]' < .ruby-version)"
          if ! [[ "$ruby_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'The trusted main branch has invalid .ruby-version %q.\n' "$ruby_version" >&2
            exit 1
          fi

          main_commit_sha="$(git rev-parse HEAD)"

          current_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$current_version" = "$PUPPETEER_VERSION" ]; then
            echo "Puppeteer ${PUPPETEER_VERSION} is already current. No image or PR will be created."
            echo "skip_upgrade=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION_TAG="v${PUPPETEER_VERSION}"
          BRANCH_NAME="chore/upgrade-puppeteer/${VERSION_TAG}"
          existing_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [ -n "$existing_branch" ]; then
            printf 'Refusing to replace existing branch %q at commit %q.\n' "$BRANCH_NAME" "$existing_branch" >&2
            exit 1
          fi

          IMAGE_TAG="ruby-${ruby_version}-puppeteer-${PUPPETEER_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "main_commit_sha=${main_commit_sha}"
            echo "branch_name=${BRANCH_NAME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "ruby_version=${ruby_version}"
            echo "skip_upgrade=false"
            echo "version_tag=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing Puppeteer ${PUPPETEER_VERSION} from main ${main_commit_sha}."

      - name: Create local upgrade branch
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
        run: git switch --create "$BRANCH_NAME"

      - name: Update Puppeteer dependencies
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          RUBY_VERSION: ${{ steps.metadata.outputs.ruby_version }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn add --exact "puppeteer@${PUPPETEER_VERSION}" --non-interactive --ignore-scripts
          sed -E -i "s|RUN yarn add puppeteer@[^[:space:]]+|RUN yarn add puppeteer@${PUPPETEER_VERSION}|" Dockerfile_browser_tools.dockerfile

          updated_puppeteer_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$updated_puppeteer_version" != "$PUPPETEER_VERSION" ]; then
            printf 'package.json has Puppeteer %q; expected %q.\n' "$updated_puppeteer_version" "$PUPPETEER_VERSION" >&2
            exit 1
          fi

          expected_yarn_selector="puppeteer@${PUPPETEER_VERSION}:"
          yarn_lock_has_expected_puppeteer_selector() {
            grep -Fqx "$expected_yarn_selector" yarn.lock
          }
          if ! yarn_lock_has_expected_puppeteer_selector; then
            printf 'yarn.lock is missing expected selector %q.\n' "$expected_yarn_selector" >&2
            exit 1
          fi

          expected_runner_install="RUN yarn add puppeteer@${PUPPETEER_VERSION}"
          runner_dockerfile_has_expected_puppeteer_install() {
            grep -Fqx "$expected_runner_install" Dockerfile_browser_tools.dockerfile
          }
          if ! runner_dockerfile_has_expected_puppeteer_install; then
            actual_runner_install="$(grep -E '^RUN yarn add puppeteer@' Dockerfile_browser_tools.dockerfile || true)"
            printf 'Runner Dockerfile install is %q; expected %q.\n' "$actual_runner_install" "$expected_runner_install" >&2
            exit 1
          fi

          ruby_base_version="$(sed -nE 's|^FROM cimg/ruby:([0-9]+\.[0-9]+\.[0-9]+)-browsers@sha256:[[:xdigit:]]+$|\1|p' Dockerfile_browser_tools.dockerfile)"
          if [ "$ruby_base_version" != "$RUBY_VERSION" ]; then
            printf 'Runner Dockerfile Ruby base is %q; .ruby-version requires %q.\n' "$ruby_base_version" "$RUBY_VERSION" >&2
            exit 1
          fi
          echo "Updated Puppeteer dependency and runner Dockerfile."

      - name: Build and publish browser tools image
        id: build_image
        if: steps.metadata.outputs.skip_upgrade != 'true'
        uses: ./.github/actions/build-browser-tools-image
        with:
          puppeteer_version: ${{ inputs.puppeteer_version }}
          ruby_version: ${{ steps.metadata.outputs.ruby_version }}
          image_tag: ${{ steps.metadata.outputs.image_tag }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USER_CCQ }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PAT_CCQ }}

      - name: Pin runner digest in CircleCI
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.image_digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Runner builder returned image digest %q; expected sha256:<64 lowercase hex characters>.\n' "$IMAGE_DIGEST" >&2
            exit 1
          fi

          image_ref='checkclientqualifiesdocker/circleci-image'
          image_ref_count="$(grep -Ec 'checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)' .circleci/config.yml || true)"
          if [ "$image_ref_count" -ne 1 ]; then
            printf 'Expected exactly one CircleCI browser-tools image reference; found %q.\n' "$image_ref_count" >&2
            exit 1
          fi
          sed -E -i "s|checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)|${image_ref}@${IMAGE_DIGEST}|" .circleci/config.yml
          git diff --check

      - name: Create verified branch commit
        id: commit
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          MAIN_COMMIT_SHA: ${{ steps.metadata.outputs.main_commit_sha }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
          VERSION_TAG: ${{ steps.metadata.outputs.version_tag }}
        run: |
          existing_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [ -n "$existing_branch" ]; then
            printf 'Refusing to replace existing branch %q at commit %q.\n' "$BRANCH_NAME" "$existing_branch" >&2
            exit 1
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main_sha" != "$MAIN_COMMIT_SHA" ]; then
            printf 'main advanced after image construction: expected %q, found %q. No branch or PR was published.\n' "$MAIN_COMMIT_SHA" "$current_main_sha" >&2
            exit 1
          fi

          delete_upgrade_branch_if_unchanged() {
            expected_upgrade_branch_sha="$1"
            current_upgrade_branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
            if [ "$current_upgrade_branch_sha" != "$expected_upgrade_branch_sha" ]; then
              printf 'Upgrade branch %q changed remotely: expected %q, found %q. Leaving it untouched.\n' \
                "$BRANCH_NAME" "$expected_upgrade_branch_sha" "$current_upgrade_branch_sha" >&2
              return 1
            fi
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH_NAME}"
          }

          upgrade_branch_creation_succeeded() {
            gh api "repos/${GH_REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH_NAME}" \
              -f sha="${MAIN_COMMIT_SHA}"
          }

          if ! upgrade_branch_creation_succeeded; then
            printf 'Could not confirm creation of upgrade branch %q at main commit %q. Leaving any existing branch untouched.\n' \
              "$BRANCH_NAME" "$MAIN_COMMIT_SHA" >&2
            exit 1
          fi

          files=(package.json Dockerfile_browser_tools.dockerfile yarn.lock .circleci/config.yml)
          additions="$(
            for file in "${files[@]}"; do
              jq -n --arg path "$file" --rawfile contents "$file" '{path: $path, contents: $contents}'
            done | jq -s .
          )"

          jq -n \
            --arg repo "$GH_REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg headline "chore: bump Puppeteer to ${VERSION_TAG}" \
            --arg oid "$MAIN_COMMIT_SHA" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $headline },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions }
                }
              }
            }' > "$RUNNER_TEMP/commit-input.json"

          commit_response="$RUNNER_TEMP/commit-response.json"
          verified_commit_creation_succeeded() {
            gh api graphql --input "$RUNNER_TEMP/commit-input.json" > "$commit_response"
          }

          if ! verified_commit_creation_succeeded; then
            delete_upgrade_branch_if_unchanged "$MAIN_COMMIT_SHA" || echo "Could not safely delete the upgrade branch after commit creation failed." >&2
            printf 'Could not create verified commit for upgrade branch %q from main commit %q.\n' \
              "$BRANCH_NAME" "$MAIN_COMMIT_SHA" >&2
            exit 1
          fi

          created_commit_sha_is_valid() {
            new_commit_sha="$(jq -er '.data.createCommitOnBranch.commit.oid // empty' "$commit_response")" &&
              [[ "$new_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          }

          if ! created_commit_sha_is_valid; then
            delete_upgrade_branch_if_unchanged "$MAIN_COMMIT_SHA" || echo "Could not safely delete the upgrade branch after its commit could not be verified." >&2
            printf 'GitHub returned invalid verified commit SHA %q; expected 40 lowercase hexadecimal characters.\n' \
              "${new_commit_sha-<unavailable>}" >&2
            exit 1
          fi
          echo "commit_sha=${new_commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Open upgrade pull request
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          MAIN_COMMIT_SHA: ${{ steps.metadata.outputs.main_commit_sha }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          NEW_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.image_digest }}
          VERSION_TAG: ${{ steps.metadata.outputs.version_tag }}
        run: |
          delete_upgrade_branch_if_unchanged() {
            expected_upgrade_branch_sha="$1"
            current_upgrade_branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
            if [ "$current_upgrade_branch_sha" != "$expected_upgrade_branch_sha" ]; then
              printf 'Upgrade branch %q changed remotely: expected %q, found %q. Leaving it untouched.\n' \
                "$BRANCH_NAME" "$expected_upgrade_branch_sha" "$current_upgrade_branch_sha" >&2
              return 1
            fi
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH_NAME}"
          }

          image_ref='checkclientqualifiesdocker/circleci-image'
          pr_title="chore: bump Puppeteer to ${VERSION_TAG}"
          pr_body=$(cat <<EOF
          Automated Puppeteer upgrade.

          - Puppeteer: ${PUPPETEER_VERSION}
          - Main commit: ${MAIN_COMMIT_SHA}
          - Runner image: ${image_ref}@${IMAGE_DIGEST}
          - Diagnostic image tag: ${IMAGE_TAG}

          The runner was built and checked before this branch was published.
          A maintainer may need to approve this PR's GitHub Actions checks.
          EOF
          )

          if gh pr create --repo "$GH_REPO" --base main --head "$BRANCH_NAME" --title "$pr_title" --body "$pr_body"; then
            echo "Created PR for ${BRANCH_NAME}."
            exit
          fi

          existing_pr="$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')" || {
            printf 'Could not confirm PR creation for branch %q. Leaving it unchanged.\n' "$BRANCH_NAME" >&2
            exit 1
          }
          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            printf 'PR #%s already exists for branch %q. Leaving its branch unchanged.\n' "$existing_pr" "$BRANCH_NAME" >&2
            exit 1
          fi

          printf 'Could not create a PR for branch %q.\n' "$BRANCH_NAME" >&2
          delete_upgrade_branch_if_unchanged "$NEW_COMMIT_SHA" || echo "Could not safely delete the upgrade branch after PR creation failed." >&2
          exit 1
