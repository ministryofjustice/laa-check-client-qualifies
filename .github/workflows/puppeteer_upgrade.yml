name: Puppeteer upgrade PR

on:
  workflow_dispatch:
    inputs:
      puppeteer_version:
        description: Puppeteer version to upgrade to (example 25.2.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      skip_pr: ${{ steps.metadata.outputs.skip_pr }}
      branch_name: ${{ steps.metadata.outputs.branch_name }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      version_tag: ${{ steps.metadata.outputs.version_tag }}
      ruby_version: ${{ steps.metadata.outputs.ruby_version }}
      puppeteer_version: ${{ steps.metadata.outputs.puppeteer_version }}
      base_sha: ${{ steps.metadata.outputs.base_sha }}
      candidate_files_b64: ${{ steps.prepare_candidate.outputs.candidate_files_b64 }}
    env:
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request and set candidate metadata
        id: metadata
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be dispatched from main (got '${GITHUB_REF_NAME}')." >&2
            exit 1
          fi

          if ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Puppeteer version. Expected semver like 25.2.1." >&2
            exit 1
          fi

          ruby_version="$(tr -d '[:space:]' < .ruby-version)"
          if ! [[ "$ruby_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The trusted main branch has an invalid .ruby-version." >&2
            exit 1
          fi

          base_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$main_sha" ]; then
            echo "Could not read the current main commit." >&2
            exit 1
          fi
          if [ "$main_sha" != "$base_sha" ]; then
            echo "main advanced during preparation. Dispatch again from current main." >&2
            exit 1
          fi

          current_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$current_version" = "$PUPPETEER_VERSION" ]; then
            echo "Puppeteer ${PUPPETEER_VERSION} is already current. No image or PR will be created."
            {
              echo "skip_pr=true"
              echo "ruby_version=${ruby_version}"
              echo "puppeteer_version=${PUPPETEER_VERSION}"
              echo "base_sha=${base_sha}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_tag="v${PUPPETEER_VERSION}"
          branch_name="chore/upgrade-puppeteer/${version_tag}"
          existing_branch="$(git ls-remote --heads origin "refs/heads/${branch_name}" | awk '{print $1}')"
          if [ -n "$existing_branch" ]; then
            echo "Refusing to replace existing branch '${branch_name}'." >&2
            exit 1
          fi

          image_tag="ruby-${ruby_version}-puppeteer-${PUPPETEER_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "skip_pr=false"
            echo "branch_name=${branch_name}"
            echo "image_tag=${image_tag}"
            echo "version_tag=${version_tag}"
            echo "ruby_version=${ruby_version}"
            echo "puppeteer_version=${PUPPETEER_VERSION}"
            echo "base_sha=${base_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare candidate dependency files
        id: prepare_candidate
        if: steps.metadata.outputs.skip_pr != 'true'
        env:
          RUBY_VERSION: ${{ steps.metadata.outputs.ruby_version }}
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn add --exact "puppeteer@${PUPPETEER_VERSION}" --non-interactive --ignore-scripts

          sed -E -i "s|RUN yarn add puppeteer@[^[:space:]]+|RUN yarn add puppeteer@${PUPPETEER_VERSION}|" Dockerfile_browser_tools.dockerfile

          if [ "$(node -p "require('./package.json').dependencies.puppeteer")" != "$PUPPETEER_VERSION" ]; then
            echo "Prepared package.json does not match the requested Puppeteer version." >&2
            exit 1
          fi

          if ! grep -Fqx "puppeteer@${PUPPETEER_VERSION}:" yarn.lock; then
            echo "Prepared yarn.lock does not contain the requested Puppeteer version." >&2
            exit 1
          fi

          if ! grep -Fqx "RUN yarn add puppeteer@${PUPPETEER_VERSION}" Dockerfile_browser_tools.dockerfile; then
            echo "Prepared runner definition does not match the requested Puppeteer version." >&2
            exit 1
          fi

          candidate_archive="$(mktemp)"
          trap 'rm -f "$candidate_archive"' EXIT
          tar -czf "$candidate_archive" -- package.json yarn.lock Dockerfile_browser_tools.dockerfile
          candidate_files_b64="$(base64 -w0 "$candidate_archive")"
          echo "candidate_files_b64=${candidate_files_b64}" >> "$GITHUB_OUTPUT"
          echo "Prepared Puppeteer ${PUPPETEER_VERSION} from main ${BASE_SHA} (Ruby ${RUBY_VERSION})."

  build-browser-tools-image:
    needs: prepare-upgrade
    if: needs.prepare-upgrade.outputs.skip_pr != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-tools-docker-image-reusable.yml
    with:
      candidate_files_b64: ${{ needs.prepare-upgrade.outputs.candidate_files_b64 }}
      base_sha: ${{ needs.prepare-upgrade.outputs.base_sha }}
      ruby_version: ${{ needs.prepare-upgrade.outputs.ruby_version }}
      puppeteer_version: ${{ needs.prepare-upgrade.outputs.puppeteer_version }}
      image_tag: ${{ needs.prepare-upgrade.outputs.image_tag }}
    secrets: inherit

  create-upgrade-pr:
    needs:
      - prepare-upgrade
      - build-browser-tools-image
    if: needs.prepare-upgrade.outputs.skip_pr != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH_NAME: ${{ needs.prepare-upgrade.outputs.branch_name }}
      IMAGE_TAG: ${{ needs.prepare-upgrade.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.build-browser-tools-image.outputs.image_digest }}
      VERSION_TAG: ${{ needs.prepare-upgrade.outputs.version_tag }}
      PUPPETEER_VERSION: ${{ needs.prepare-upgrade.outputs.puppeteer_version }}
      RUBY_VERSION: ${{ needs.prepare-upgrade.outputs.ruby_version }}
      BASE_SHA: ${{ needs.prepare-upgrade.outputs.base_sha }}
      CANDIDATE_FILES_B64: ${{ needs.prepare-upgrade.outputs.candidate_files_b64 }}
    steps:
      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-upgrade.outputs.base_sha }}
          fetch-depth: 0

      - name: Add image digest to candidate
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The runner builder did not return a valid image digest." >&2
            exit 1
          fi

          candidate_dir="$(mktemp -d)"
          archive="$(mktemp)"
          trap 'rm -rf "$candidate_dir" "$archive"' EXIT
          printf '%s' "$CANDIDATE_FILES_B64" | base64 --decode > "$archive"
          tar -xzf "$archive" -C "$candidate_dir"

          cp "$candidate_dir/package.json" package.json
          cp "$candidate_dir/yarn.lock" yarn.lock
          cp "$candidate_dir/Dockerfile_browser_tools.dockerfile" Dockerfile_browser_tools.dockerfile

          image_ref='checkclientqualifiesdocker/circleci-image'
          image_ref_count="$(grep -Ec 'checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)' .circleci/config.yml || true)"
          if [ "$image_ref_count" -ne 1 ]; then
            echo "Expected exactly one CircleCI browser-tools image reference." >&2
            exit 1
          fi
          sed -E -i "s|checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)|${image_ref}@${IMAGE_DIGEST}|" .circleci/config.yml

          git diff --check

      - name: Publish candidate branch and verified commit
        id: commit
        run: |
          existing_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [ -n "$existing_branch" ]; then
            echo "Refusing to replace existing branch '${BRANCH_NAME}'." >&2
            exit 1
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main_sha" != "$BASE_SHA" ]; then
            echo "main advanced after image construction. No branch or PR was published." >&2
            exit 1
          fi

          cleanup_created_branch() {
            expected_sha="$1"
            current_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "Branch '${BRANCH_NAME}' changed remotely. Leaving it untouched." >&2
              return 1
            fi
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH_NAME}"
          }

          gh api "repos/${GH_REPO}/git/refs" \
            -f ref="refs/heads/${BRANCH_NAME}" \
            -f sha="${BASE_SHA}"

          files=(package.json Dockerfile_browser_tools.dockerfile yarn.lock .circleci/config.yml)
          additions="$(
            for file in "${files[@]}"; do
              jq -n --arg path "$file" --rawfile contents "$file" '{path: $path, contents: $contents}'
            done | jq -s .
          )"

          jq -n \
            --arg repo "$GH_REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg headline "chore: bump Puppeteer to ${VERSION_TAG}" \
            --arg oid "$BASE_SHA" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $headline },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions }
                }
              }
            }' > "$RUNNER_TEMP/commit-input.json"

          commit_response="$RUNNER_TEMP/commit-response.json"
          if ! gh api graphql --input "$RUNNER_TEMP/commit-input.json" > "$commit_response"; then
            cleanup_created_branch "$BASE_SHA" || echo "Could not safely clean up the new branch after commit creation failed." >&2
            exit 1
          fi

          if ! new_commit_sha="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' "$commit_response")"; then
            cleanup_created_branch "$BASE_SHA" || echo "Could not safely clean up the new branch after its commit could not be verified." >&2
            echo "Could not read the created commit from GitHub." >&2
            exit 1
          fi

          if ! [[ "$new_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            cleanup_created_branch "$BASE_SHA" || echo "Could not safely clean up the new branch after its commit could not be verified." >&2
            echo "GitHub did not return the expected verified commit." >&2
            exit 1
          fi

          echo "commit_sha=${new_commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Open upgrade pull request
        env:
          NEW_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          cleanup_created_branch() {
            expected_sha="$1"
            current_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "Branch '${BRANCH_NAME}' changed remotely. Leaving it untouched." >&2
              return 1
            fi
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH_NAME}"
          }

          pr_title="chore: bump Puppeteer to ${VERSION_TAG}"
          image_ref='checkclientqualifiesdocker/circleci-image'
          pr_body=$(cat <<EOF
          Automated Puppeteer upgrade.

          - Puppeteer: ${PUPPETEER_VERSION}
          - Base commit: ${BASE_SHA}
          - Runner image: ${image_ref}@${IMAGE_DIGEST}
          - Diagnostic image tag: ${IMAGE_TAG}

          The runner was built and checked before this branch was published.
          A maintainer may need to approve this PR's GitHub Actions checks.
          EOF
          )

          if gh pr create --repo "$GH_REPO" --base main --head "$BRANCH_NAME" --title "$pr_title" --body "$pr_body"; then
            echo "Created PR for ${BRANCH_NAME}."
            exit
          fi

          existing_pr="$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')" || {
            echo "Could not confirm PR creation. Leaving '${BRANCH_NAME}' unchanged." >&2
            exit 1
          }

          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            echo "A PR exists for '${BRANCH_NAME}'. Leaving its branch unchanged." >&2
            exit 1
          fi

          cleanup_created_branch "$NEW_COMMIT_SHA" || echo "Could not safely clean up the new branch after PR creation failed." >&2
          exit 1
