name: Puppeteer upgrade PR

on:
  workflow_dispatch:
    inputs:
      puppeteer_version:
        description: Puppeteer version to upgrade to (example 25.2.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      skip_pr: ${{ steps.commit_changes.outputs.skip_pr }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate input and derive branch metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be dispatched from main (got '${GITHUB_REF_NAME}')." >&2
            exit 1
          fi

          if ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$PUPPETEER_VERSION'. Expected semver like 25.2.1" >&2
            exit 1
          fi

          version_tag="v${PUPPETEER_VERSION}"
          # Branch must satisfy the repo-wide branch-name-validator (chore/.+).
          branch_name="chore/upgrade-puppeteer/${version_tag}"
          # Docker tags can't contain slashes, so keep the image tag separate from the branch name.
          image_tag="puppeteer-${version_tag}"

          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${branch_name}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${version_tag}" >> "$GITHUB_ENV"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or reset upgrade branch
        run: |
          git fetch origin main
          git checkout -B "$BRANCH_NAME" "origin/main"

      - name: Enable Yarn and update pinned versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

          yarn add --exact "puppeteer@${PUPPETEER_VERSION}" --non-interactive --ignore-scripts

          # Align requested version with browser-tools Dockerfile Puppeteer pinned version.
          sed -E -i "s|RUN yarn add puppeteer@[^[:space:]]+|RUN yarn add puppeteer@${PUPPETEER_VERSION}|" Dockerfile_browser_tools.dockerfile

          # Align requested version branch with CircleCI's test image tag.
          sed -E -i "s|(checkclientqualifiesdocker/circleci-image:)puppeteer-v?[0-9]+(\.[0-9]+\.[0-9]+)?|\\1${IMAGE_TAG}|g" .circleci/config.yml

      - name: Commit and push changes
        id: commit_changes
        run: |
          echo "skip_pr=false" >> "$GITHUB_OUTPUT"

          if git diff --quiet; then
            echo "No changes were produced. The requested Puppeteer version may already be current."
            echo "skip_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add package.json Dockerfile_browser_tools.dockerfile yarn.lock .circleci/config.yml
          git commit -m "chore: bump puppeteer to ${VERSION_TAG}"
          git push --force-with-lease origin "$BRANCH_NAME"

  build-browser-tools-image:
    needs: prepare-upgrade
    if: needs.prepare-upgrade.outputs.skip_pr != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-tools-docker-image-reusable.yml
    with:
      source_ref: ${{ needs.prepare-upgrade.outputs.branch_name }}
      image_tag: ${{ needs.prepare-upgrade.outputs.image_tag }}
      source_actor: ${{ github.actor }}
      enforce_actor_policy: false
    secrets: inherit

  create-upgrade-pr:
    needs:
      - prepare-upgrade
      - build-browser-tools-image
    if: needs.prepare-upgrade.outputs.skip_pr != 'true' && needs.build-browser-tools-image.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
      BRANCH_NAME: ${{ needs.prepare-upgrade.outputs.branch_name }}
      IMAGE_TAG: ${{ needs.prepare-upgrade.outputs.image_tag }}
      VERSION_TAG: ${{ needs.prepare-upgrade.outputs.version_tag }}
    steps:
      - name: Create or update pull request
        run: |
          pr_title="chore: bump puppeteer to ${VERSION_TAG}"
          pr_body=$(cat <<EOF
          Automated Puppeteer upgrade via GitHub Actions.

          Changes made:
          - package.json Puppeteer dependency set to ${PUPPETEER_VERSION}
          - Dockerfile_browser_tools.dockerfile Puppeteer pin updated
          - yarn.lock refreshed with yarn add --exact puppeteer@${PUPPETEER_VERSION}
          - .circleci/config.yml test image updated to ${IMAGE_TAG}

          The browser tools image workflow will push:
          - checkclientqualifiesdocker/circleci-image:${IMAGE_TAG}
          EOF
          )

          existing_pr=$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
          if [[ -n "$existing_pr" && "$existing_pr" != "null" ]]; then
            gh pr edit "$existing_pr" --repo "$GH_REPO" --title "$pr_title" --body "$pr_body"
          else
            gh pr create --repo "$GH_REPO" --base main --head "$BRANCH_NAME" --title "$pr_title" --body "$pr_body"
          fi
