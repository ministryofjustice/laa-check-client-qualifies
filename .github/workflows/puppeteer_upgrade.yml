name: Puppeteer upgrade PR

on:
  workflow_dispatch:
    inputs:
      puppeteer_version:
        description: Puppeteer version to upgrade to (example 25.2.1)
        required: true
        type: string
      ruby_version:
        description: Optional application and runner Ruby version override
        required: false
        type: string
      rebuild_runner:
        description: Rebuild the runner when Puppeteer is already current
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  GH_REPO: ${{ github.repository }}
  PUPPETEER_VERSION: ${{ inputs.puppeteer_version }}
  RUBY_VERSION_OVERRIDE: ${{ inputs.ruby_version }}

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_upgrade: ${{ steps.metadata.outputs.skip_upgrade }}
      main_commit_sha: ${{ steps.metadata.outputs.main_commit_sha }}
      branch_name: ${{ steps.metadata.outputs.branch_name }}
      ruby_version: ${{ steps.metadata.outputs.ruby_version }}
      ruby_version_changed: ${{ steps.metadata.outputs.ruby_version_changed }}
      puppeteer_version: ${{ steps.metadata.outputs.puppeteer_version }}
      pr_title: ${{ steps.metadata.outputs.pr_title }}
      candidate_artifact: ${{ steps.metadata.outputs.candidate_artifact }}
      artifact_paths: ${{ steps.update_candidate.outputs.artifact_paths }}
      existing_branch_sha: ${{ steps.metadata.outputs.existing_branch_sha }}
      existing_pr_number: ${{ steps.metadata.outputs.existing_pr_number }}
      existing_pr_head_sha: ${{ steps.metadata.outputs.existing_pr_head_sha }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request and set upgrade metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            printf 'This workflow must be dispatched from main; current ref is %q.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          if ! [[ "$PUPPETEER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid Puppeteer version %q. Expected semver like 25.2.1.\n' "$PUPPETEER_VERSION" >&2
            exit 1
          fi

          main_ruby_version="$(tr -d '[:space:]' < .ruby-version)"
          ruby_version="$main_ruby_version"
          ruby_version_source="trusted main .ruby-version"
          if [ -n "$RUBY_VERSION_OVERRIDE" ]; then
            ruby_version="$RUBY_VERSION_OVERRIDE"
            ruby_version_source="Ruby version override"
          fi

          if ! [[ "$ruby_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid %s %q. Expected semver like 4.0.5.\n' "$ruby_version_source" "$ruby_version" >&2
            exit 1
          fi

          ruby_version_changed=false
          if [ "$ruby_version" != "$main_ruby_version" ]; then
            ruby_version_changed=true
          fi

          main_commit_sha="$(git rev-parse HEAD)"

          current_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$current_version" = "$PUPPETEER_VERSION" ] && [ "$ruby_version_changed" = false ] && [ "${{ inputs.rebuild_runner }}" != "true" ]; then
            echo "Puppeteer ${PUPPETEER_VERSION} and Ruby ${ruby_version} are already current. No image or PR will be created."
            echo "skip_upgrade=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ruby_version_changed" = true ]; then
            BRANCH_NAME="chore/upgrade-runner/ruby-v${ruby_version}-puppeteer-v${PUPPETEER_VERSION}"
            PR_TITLE="chore: update runner to Ruby v${ruby_version} and Puppeteer v${PUPPETEER_VERSION}"
          else
            BRANCH_NAME="chore/upgrade-puppeteer/v${PUPPETEER_VERSION}"
            PR_TITLE="chore: bump Puppeteer to v${PUPPETEER_VERSION}"
          fi
          ARTIFACT_NAME="runner-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          existing_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"

          existing_pr="$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main \
            --json number,headRefOid --jq '.[0]')"
          existing_pr_number="$(jq -r '.number // empty' <<< "$existing_pr")"
          existing_pr_head_sha="$(jq -r '.headRefOid // empty' <<< "$existing_pr")"

          if [ -n "$existing_branch" ]; then
            latest_commit_author="$(gh api "repos/${GH_REPO}/commits/${existing_branch}" --jq '.author.login // empty')"
            if [ "$latest_commit_author" != "github-actions[bot]" ]; then
              printf 'Latest commit on upgrade branch %q is not from github-actions[bot].\n' "$BRANCH_NAME" >&2
              exit 1
            fi
          fi

          {
            echo "main_commit_sha=${main_commit_sha}"
            echo "branch_name=${BRANCH_NAME}"
            echo "ruby_version=${ruby_version}"
            echo "ruby_version_changed=${ruby_version_changed}"
            echo "puppeteer_version=${PUPPETEER_VERSION}"
            echo "skip_upgrade=false"
            echo "pr_title=${PR_TITLE}"
            echo "candidate_artifact=${ARTIFACT_NAME}"
            echo "existing_branch_sha=${existing_branch}"
            echo "existing_pr_number=${existing_pr_number}"
            echo "existing_pr_head_sha=${existing_pr_head_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing Puppeteer ${PUPPETEER_VERSION} and Ruby ${ruby_version} from main ${main_commit_sha}."

      - name: Create local upgrade branch
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
        run: git switch --create "$BRANCH_NAME"

      - name: Set up requested Ruby for lockfile preparation
        if: steps.metadata.outputs.skip_upgrade != 'true' && steps.metadata.outputs.ruby_version_changed == 'true'
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ steps.metadata.outputs.ruby_version }}

      - name: Update requested dependency pins
        id: update_candidate
        if: steps.metadata.outputs.skip_upgrade != 'true'
        env:
          RUBY_VERSION: ${{ steps.metadata.outputs.ruby_version }}
          RUBY_VERSION_CHANGED: ${{ steps.metadata.outputs.ruby_version_changed }}
          PUPPETEER_VERSION: ${{ steps.metadata.outputs.puppeteer_version }}
        run: |
          if [ "$RUBY_VERSION_CHANGED" = true ]; then
            ruby script/update_ruby_version.rb "$RUBY_VERSION"
            bundle lock

            lockfile_ruby_version="$(sed -nE 's/^  ruby ([0-9]+\.[0-9]+\.[0-9]+)(p[0-9]+)?$/\1/p' Gemfile.lock)"
            if [ "$lockfile_ruby_version" != "$RUBY_VERSION" ]; then
              printf 'Gemfile.lock Ruby metadata is %q; expected %q.\n' "$lockfile_ruby_version" "$RUBY_VERSION" >&2
              exit 1
            fi
          fi

          current_puppeteer_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$current_puppeteer_version" != "$PUPPETEER_VERSION" ]; then
            corepack enable
            corepack prepare yarn@1.22.22 --activate
            yarn add --exact "puppeteer@${PUPPETEER_VERSION}" --non-interactive --ignore-scripts
            sed -E -i "s|RUN yarn add puppeteer@[^[:space:]]+|RUN yarn add puppeteer@${PUPPETEER_VERSION}|" Dockerfile_browser_tools.dockerfile
          fi

          updated_puppeteer_version="$(node -p "require('./package.json').dependencies.puppeteer")"
          if [ "$updated_puppeteer_version" != "$PUPPETEER_VERSION" ]; then
            printf 'package.json has Puppeteer %q; expected %q.\n' "$updated_puppeteer_version" "$PUPPETEER_VERSION" >&2
            exit 1
          fi

          expected_yarn_selector="puppeteer@${PUPPETEER_VERSION}:"
          yarn_selector_match="$(grep -Fx "$expected_yarn_selector" yarn.lock || true)"
          if [ -z "$yarn_selector_match" ]; then
            printf 'yarn.lock is missing expected selector %q.\n' "$expected_yarn_selector" >&2
            exit 1
          fi

          expected_runner_install="RUN yarn add puppeteer@${PUPPETEER_VERSION}"
          runner_install_match="$(grep -Fx "$expected_runner_install" Dockerfile_browser_tools.dockerfile || true)"
          if [ -z "$runner_install_match" ]; then
            actual_runner_install="$(grep -E '^RUN yarn add puppeteer@' Dockerfile_browser_tools.dockerfile || true)"
            printf 'Runner Dockerfile install is %q; expected %q.\n' "$actual_runner_install" "$expected_runner_install" >&2
            exit 1
          fi

          ruby_base_version="$(sed -nE 's|^FROM cimg/ruby:([0-9]+\.[0-9]+\.[0-9]+)-browsers@sha256:[[:xdigit:]]+$|\1|p' Dockerfile_browser_tools.dockerfile)"
          if [ "$ruby_base_version" != "$RUBY_VERSION" ]; then
            printf 'Runner Dockerfile Ruby base is %q; .ruby-version requires %q.\n' "$ruby_base_version" "$RUBY_VERSION" >&2
            exit 1
          fi
          {
            git diff --name-only
            echo ".circleci/config.yml"
          } | sort -u > runner-upgrade-files.txt

          {
            echo "artifact_paths<<EOF"
            echo "runner-upgrade-files.txt"
            cat runner-upgrade-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Updated requested runtime pins and runner definition."

      - name: Upload prepared candidate
        if: steps.metadata.outputs.skip_upgrade != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.candidate_artifact }}
          path: ${{ steps.update_candidate.outputs.artifact_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-browser-tools-image:
    needs: prepare-upgrade
    if: needs.prepare-upgrade.outputs.skip_upgrade != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image_metadata.outputs.image_tag }}
      image_digest: ${{ steps.build_image.outputs.image_digest }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          fetch-depth: 0

      - name: Download prepared candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.prepare-upgrade.outputs.candidate_artifact }}
          path: ${{ github.workspace }}

      - name: Set unique runner image tag
        id: image_metadata
        env:
          RUBY_VERSION: ${{ needs.prepare-upgrade.outputs.ruby_version }}
          PUPPETEER_VERSION: ${{ needs.prepare-upgrade.outputs.puppeteer_version }}
        run: |
          image_tag="ruby-${RUBY_VERSION}-puppeteer-${PUPPETEER_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Build and publish browser tools image
        id: build_image
        uses: ./.github/actions/build-browser-tools-image
        with:
          puppeteer_version: ${{ needs.prepare-upgrade.outputs.puppeteer_version }}
          ruby_version: ${{ needs.prepare-upgrade.outputs.ruby_version }}
          image_tag: ${{ steps.image_metadata.outputs.image_tag }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USER_CCQ }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PAT_CCQ }}

  create-upgrade-pr:
    needs:
      - prepare-upgrade
      - build-browser-tools-image
    if: needs.prepare-upgrade.outputs.skip_upgrade != 'true' && needs.build-browser-tools-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          fetch-depth: 0

      - name: Download prepared candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.prepare-upgrade.outputs.candidate_artifact }}
          path: ${{ github.workspace }}

      - name: Pin runner digest in CircleCI
        env:
          IMAGE_DIGEST: ${{ needs.build-browser-tools-image.outputs.image_digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Runner builder returned image digest %q; expected sha256:<64 lowercase hex characters>.\n' "$IMAGE_DIGEST" >&2
            exit 1
          fi

          image_ref='checkclientqualifiesdocker/circleci-image'
          image_ref_count="$(grep -Ec 'checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)' .circleci/config.yml || true)"
          if [ "$image_ref_count" -ne 1 ]; then
            printf 'Expected exactly one CircleCI browser-tools image reference; found %q.\n' "$image_ref_count" >&2
            exit 1
          fi
          sed -E -i "s|checkclientqualifiesdocker/circleci-image([@:][^[:space:]]+)|${image_ref}@${IMAGE_DIGEST}|" .circleci/config.yml
          git diff --check

      - name: Create temporary candidate branch
        id: candidate_branch
        env:
          MAIN_COMMIT_SHA: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          CANDIDATE_BRANCH: automation/puppeteer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! gh api "repos/${GH_REPO}/git/refs" \
            -f ref="refs/heads/${CANDIDATE_BRANCH}" \
            -f sha="${MAIN_COMMIT_SHA}"; then
            printf 'Could not create temporary candidate branch %q at main commit %q.\n' \
              "$CANDIDATE_BRANCH" "$MAIN_COMMIT_SHA" >&2
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create verified candidate commit
        id: commit
        env:
          MAIN_COMMIT_SHA: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          CANDIDATE_BRANCH: automation/puppeteer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          PR_TITLE: ${{ needs.prepare-upgrade.outputs.pr_title }}
        run: |
          mapfile -t files < runner-upgrade-files.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Candidate file manifest is empty." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              .ruby-version|Gemfile|Gemfile.lock|Dockerfile|Dockerfile_browser_tools.dockerfile|docker-images.json|.circleci/config.yml|.github/workflows/rubocop.yml|README.md|package.json|yarn.lock) ;;
              *)
                printf 'Candidate file manifest contains unexpected path %q.\n' "$file" >&2
                exit 1
                ;;
            esac
          done
          additions="$(
            for file in "${files[@]}"; do
              jq -n --arg path "$file" --rawfile contents "$file" '{path: $path, contents: $contents}'
            done | jq -s .
          )"

          jq -n \
            --arg repo "$GH_REPO" \
            --arg branch "$CANDIDATE_BRANCH" \
            --arg headline "$PR_TITLE" \
            --arg oid "$MAIN_COMMIT_SHA" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $headline },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions }
                }
              }
            }' > "$RUNNER_TEMP/commit-input.json"

          commit_response="$RUNNER_TEMP/commit-response.json"
          verified_commit_creation_succeeded() {
            gh api graphql --input "$RUNNER_TEMP/commit-input.json" > "$commit_response"
          }
          if ! verified_commit_creation_succeeded; then
            printf 'Could not create verified candidate commit from main commit %q.\n' "$MAIN_COMMIT_SHA" >&2
            exit 1
          fi

          new_commit_sha="$(jq -er '.data.createCommitOnBranch.commit.oid // empty' "$commit_response" || true)"
          if ! [[ "$new_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'GitHub returned invalid verified commit SHA %q; expected 40 lowercase hexadecimal characters.\n' \
              "${new_commit_sha-<unavailable>}" >&2
            exit 1
          fi
          echo "commit_sha=${new_commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish upgrade branch
        id: publish_branch
        env:
          MAIN_COMMIT_SHA: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          BRANCH_NAME: ${{ needs.prepare-upgrade.outputs.branch_name }}
          CANDIDATE_BRANCH: automation/puppeteer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          NEW_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          EXISTING_BRANCH_SHA: ${{ needs.prepare-upgrade.outputs.existing_branch_sha }}
          EXISTING_PR_NUMBER: ${{ needs.prepare-upgrade.outputs.existing_pr_number }}
          EXISTING_PR_HEAD_SHA: ${{ needs.prepare-upgrade.outputs.existing_pr_head_sha }}
        run: |
          current_upgrade_branch_sha=''

          require_main_unchanged() {
            local current_main_sha
            current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

            if [ "$current_main_sha" != "$MAIN_COMMIT_SHA" ]; then
              printf 'main advanced after image construction: expected %q, found %q. No branch or PR was published.\n' \
                "$MAIN_COMMIT_SHA" "$current_main_sha" >&2
              exit 1
            fi
          }

          require_upgrade_branch_unchanged() {
            current_upgrade_branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"

            if [ "$current_upgrade_branch_sha" != "$EXISTING_BRANCH_SHA" ]; then
              printf 'Upgrade branch %q changed after preparation: expected %q, found %q.\n' \
                "$BRANCH_NAME" "$EXISTING_BRANCH_SHA" "$current_upgrade_branch_sha" >&2
              exit 1
            fi
          }

          require_open_pr_unchanged() {
            local current_pr current_pr_number current_pr_head_sha
            current_pr="$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main \
              --json number,headRefOid --jq '.[0]')"
            current_pr_number="$(jq -r '.number // empty' <<< "$current_pr")"
            current_pr_head_sha="$(jq -r '.headRefOid // empty' <<< "$current_pr")"

            if [ "$current_pr_number" != "$EXISTING_PR_NUMBER" ] || [ "$current_pr_head_sha" != "$EXISTING_PR_HEAD_SHA" ]; then
              printf 'Open PR state for branch %q changed after preparation: expected %q/%q, found %q/%q.\n' \
                "$BRANCH_NAME" "$EXISTING_PR_NUMBER" "$EXISTING_PR_HEAD_SHA" \
                "$current_pr_number" "$current_pr_head_sha" >&2
              exit 1
            fi
          }

          #######################################################

          publish_upgrade_branch() {
            if [ -z "$EXISTING_BRANCH_SHA" ]; then
              if ! gh api "repos/${GH_REPO}/git/refs" \
                -f ref="refs/heads/${BRANCH_NAME}" \
                -f sha="${NEW_COMMIT_SHA}"; then
                return 1
              fi

              echo "created=true" >> "$GITHUB_OUTPUT"
              return
            fi

            if ! git fetch origin \
              "refs/heads/${CANDIDATE_BRANCH}" \
              "refs/heads/${BRANCH_NAME}"; then
              printf 'Could not fetch candidate or existing upgrade branch %q.\n' "$BRANCH_NAME" >&2
              return 1
            fi

            if ! echo "replacement_attempted=true" >> "$GITHUB_OUTPUT"; then
              printf 'Could not record replacement state for branch %q.\n' "$BRANCH_NAME" >&2
              return 1
            fi

            if ! git push \
              --force-with-lease="refs/heads/${BRANCH_NAME}:${EXISTING_BRANCH_SHA}" \
              origin "${NEW_COMMIT_SHA}:refs/heads/${BRANCH_NAME}"; then
              printf 'Could not replace upgrade branch %q at its captured commit %q.\n' \
                "$BRANCH_NAME" "$EXISTING_BRANCH_SHA" >&2
              return 1
            fi
          }

          require_main_unchanged
          require_upgrade_branch_unchanged
          require_open_pr_unchanged

          if ! publish_upgrade_branch; then
            printf 'Could not publish candidate commit %q to upgrade branch %q.\n' \
              "$NEW_COMMIT_SHA" "$BRANCH_NAME" >&2
            exit 1
          fi

      - name: Open or update upgrade pull request
        if: needs.prepare-upgrade.outputs.skip_upgrade != 'true'
        env:
          MAIN_COMMIT_SHA: ${{ needs.prepare-upgrade.outputs.main_commit_sha }}
          BRANCH_NAME: ${{ needs.prepare-upgrade.outputs.branch_name }}
          EXISTING_PR_NUMBER: ${{ needs.prepare-upgrade.outputs.existing_pr_number }}
          IMAGE_TAG: ${{ needs.build-browser-tools-image.outputs.image_tag }}
          NEW_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ needs.build-browser-tools-image.outputs.image_digest }}
          UPGRADE_VERSION: ${{ needs.prepare-upgrade.outputs.ruby_version }}
          PUPPETEER_VERSION: ${{ needs.prepare-upgrade.outputs.puppeteer_version }}
          PR_TITLE: ${{ needs.prepare-upgrade.outputs.pr_title }}
        run: |
          image_ref='checkclientqualifiesdocker/circleci-image'
          pr_body=$(cat <<EOF
          Automated runner upgrade.

          - Puppeteer: ${PUPPETEER_VERSION}
          - Ruby: ${UPGRADE_VERSION}
          - Main commit: ${MAIN_COMMIT_SHA}
          - Runner image: ${image_ref}@${IMAGE_DIGEST}
          - Diagnostic image tag: ${IMAGE_TAG}

          The runner was built and checked before this branch was published.
          A maintainer may need to approve this PR's GitHub Actions checks.
          EOF
          )

          if [ -n "$EXISTING_PR_NUMBER" ]; then
            if gh pr edit "$EXISTING_PR_NUMBER" --repo "$GH_REPO" --title "$PR_TITLE" --body "$pr_body"; then
              echo "Updated PR #${EXISTING_PR_NUMBER} for ${BRANCH_NAME}."
              exit
            fi

            printf 'Could not update PR #%s for branch %q.\n' "$EXISTING_PR_NUMBER" "$BRANCH_NAME" >&2
            exit 1
          fi

          if gh pr create --repo "$GH_REPO" --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body "$pr_body"; then
            echo "Created PR for ${BRANCH_NAME}."
            exit
          fi

          printf 'Could not create a PR for branch %q.\n' "$BRANCH_NAME" >&2
          exit 1

      - name: Clean up failed upgrade branch
        if: failure() && (steps.publish_branch.outputs.created == 'true' || steps.publish_branch.outputs.replacement_attempted == 'true')
        env:
          BRANCH_NAME: ${{ needs.prepare-upgrade.outputs.branch_name }}
          NEW_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          EXISTING_BRANCH_SHA: ${{ needs.prepare-upgrade.outputs.existing_branch_sha }}
          REPLACEMENT_ATTEMPTED: ${{ steps.publish_branch.outputs.replacement_attempted }}
        run: |
          if [ "$REPLACEMENT_ATTEMPTED" = 'true' ]; then
            current_upgrade_branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"

            if [ "$current_upgrade_branch_sha" = "$EXISTING_BRANCH_SHA" ]; then
              echo "Upgrade branch ${BRANCH_NAME} remains at its captured commit."
              exit 0
            fi

            if [ "$current_upgrade_branch_sha" != "$NEW_COMMIT_SHA" ]; then
              printf 'Upgrade branch %q changed after replacement attempt: found %q. Leaving it untouched.\n' \
                "$BRANCH_NAME" "$current_upgrade_branch_sha" >&2
              exit 0
            fi

            if ! git push \
              --force-with-lease="refs/heads/${BRANCH_NAME}:${NEW_COMMIT_SHA}" \
              origin "${EXISTING_BRANCH_SHA}:refs/heads/${BRANCH_NAME}"; then
              printf 'Could not restore upgrade branch %q to its captured commit %q.\n' \
                "$BRANCH_NAME" "$EXISTING_BRANCH_SHA" >&2
              exit 1
            fi

            echo "Restored upgrade branch ${BRANCH_NAME} to its captured commit."
            exit 0
          fi

          existing_pr="$(gh pr list --repo "$GH_REPO" --state open --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')" || {
            printf 'Could not check for an open PR for branch %q. Leaving it untouched.\n' "$BRANCH_NAME" >&2
            exit 1
          }
          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            printf 'PR #%s exists for branch %q. Leaving its branch untouched.\n' "$existing_pr" "$BRANCH_NAME" >&2
            exit 0
          fi

          current_upgrade_branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [ "$current_upgrade_branch_sha" != "$NEW_COMMIT_SHA" ]; then
            printf 'Upgrade branch %q changed remotely: expected %q, found %q. Leaving it untouched.\n' \
              "$BRANCH_NAME" "$NEW_COMMIT_SHA" "$current_upgrade_branch_sha" >&2
            exit 0
          fi

          if ! gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH_NAME}"; then
            printf 'Could not delete upgrade branch %q at commit %q.\n' \
              "$BRANCH_NAME" "$NEW_COMMIT_SHA" >&2
            exit 1
          fi

      - name: Clean up temporary candidate branch
        if: always() && steps.candidate_branch.outputs.created == 'true'
        env:
          CANDIDATE_BRANCH: automation/puppeteer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${CANDIDATE_BRANCH}"; then
            printf 'Could not delete temporary candidate branch %q.\n' "$CANDIDATE_BRANCH" >&2
            exit 1
          fi
